set -g mouse on
set -g set-clipboard off
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# WezTerm Cmd shortcuts send the tmux prefix followed by these keys.
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'
bind b if-shell -F "#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},vim}}" "send-keys C-b" "send-keys \"EDITOR='code --wait' VISUAL='code --wait' yazi\" Enter"
bind x kill-pane
bind 1 select-pane -t :.1
bind 2 select-pane -t :.2
bind 3 select-pane -t :.3
bind 4 select-pane -t :.4
bind 5 select-pane -t :.5


# Common terminal paste shortcut outside WezTerm.
bind-key -n C-S-v run-shell -b 'pbpaste | tmux load-buffer - && tmux paste-buffer'


# Explicit resurrection commands; plugins remain installed but are not auto-loaded.
bind C-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'
